name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    # Throwaway Postgres for the money-safety e2e suite. Ports match `.env.test`
    # so the same command works locally (docker compose) and here.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meduman
          POSTGRES_PASSWORD: meduman
          POSTGRES_DB: meduman_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U meduman -d meduman_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Apply migrations to the test database
        run: npm run db:migrate:test

      # The money-safety specs fake Paystack, auth and the queue, so Postgres is
      # the only service they need. They cover all six rules — treat a failure
      # here as a release blocker, not a flake.
      - name: Money-safety e2e tests
        run: npm run test:e2e
